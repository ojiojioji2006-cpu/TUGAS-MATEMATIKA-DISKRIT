<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Matematika Diskrit</title>
    <style>
        /* --- RESET & BASIC STYLE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #ffffff; /* Background Putih sesuai request */
            color: #333;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- CONTAINER UTAMA --- */
        .container {
            width: 100%;
            max-width: 800px;
            background: #fff;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        /* --- CARD STYLE (Kotak-kotak menu) --- */
        .card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); /* Shadow halus */
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #f0f0f0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px); /* Efek naik sedikit saat hover */
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .card h2 {
            font-size: 1.5rem;
            color: #34495e;
            margin-bottom: 20px;
            border-bottom: 2px solid #3498db;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* --- FORM ELEMENTS --- */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], 
        input[type="number"], 
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            background-color: #fafafa;
        }

        /* Efek Smooth saat diklik */
        input:focus, select:focus {
            border-color: #3498db;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
        }

        /* --- BUTTONS --- */
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-weight: 600;
            width: 100%;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            transform: scale(0.98);
        }

        /* --- HASIL OUTPUT --- */
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 5px solid #2ecc71;
            border-radius: 5px;
            display: none; /* Sembunyikan default */
            animation: fadeIn 0.5s ease;
        }

        .result-box h3 {
            font-size: 1.1rem;
            color: #27ae60;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }

        /* --- ANIMASI --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            margin-top: 50px;
            color: #aaa;
            font-size: 0.9rem;
        }
        
        footer a {
            color: #3498db;
            text-decoration: none;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Matematika Diskrit</h1>
            <p>Kalkulator Sederhana & Interaktif</p>
        </header>

        <!-- CONTOH 1: KONVERSI BILANGAN -->
        <div class="card">
            <h2>1. Konversi Bilangan</h2>
            <div class="form-group">
                <label>Masukkan Angka (Desimal):</label>
                <input type="number" id="inputDesimal" placeholder="Contoh: 100">
            </div>
            <button onclick="hitungKonversi()">Konversi Sekarang</button>
            
            <div id="hasilKonversi" class="result-box">
                <h3>Hasil:</h3>
                <p id="outputKonversi" class="result-value"></p>
            </div>
        </div>

        <!-- CONTOH 2: OPERASI HIMPUNAN (Simulasi) -->
        <div class="card">
            <h2>2. Operasi Himpunan</h2>
            <div class="form-group">
                <label>Himpunan A (pisahkan dengan koma):</label>
                <input type="text" id="setA" placeholder="Contoh: 1, 2, 3, 4">
            </div>
            <div class="form-group">
                <label>Himpunan B (pisahkan dengan koma):</label>
                <input type="text" id="setB" placeholder="Contoh: 3, 4, 5, 6">
            </div>
            <button onclick="hitungHimpunan()">Hitung Irisan (Intersection)</button>

            <div id="hasilHimpunan" class="result-box">
                <h3>A ∩ B =</h3>
                <p id="outputHimpunan" class="result-value"></p>
            </div>
        </div>

        <footer>
            <p>Dibuat dengan ❤️ oleh <a href="https://github.com/ojiojioji2006-cpu" target="_blank">@ojiojioji2006-cpu</a></p>
        </footer>
    </div>

    <script>
        // --- LOGIKA JAVASCRIPT ---

        // 1. Fungsi Konversi Bilangan
        function hitungKonversi() {
            const desimal = document.getElementById('inputDesimal').value;
            const outputBox = document.getElementById('hasilKonversi');
            const outputText = document.getElementById('outputKonversi');

            if (desimal === "") {
                alert("Mohon masukkan angka terlebih dahulu!");
                return;
            }

            const num = parseInt(desimal);
            
            // Format hasil
            const biner = num.toString(2);
            const oktal = num.toString(8);
            const hexa = num.toString(16).toUpperCase();

            outputText.innerHTML = `
                Biner: <b>${biner}</b><br>
                Oktal: <b>${oktal}</b><br>
                Hexadesimal: <b>${hexa}</b>
            `;
            
            // Tampilkan box hasil dengan animasi
            outputBox.style.display = "block";
        }

        // 2. Fungsi Himpunan (Irisan/Intersection)
        function hitungHimpunan() {
            const inputA = document.getElementById('setA').value;
            const inputB = document.getElementById('setB').value;
            const outputBox = document.getElementById('hasilHimpunan');
            const outputText = document.getElementById('outputHimpunan');

            if (!inputA || !inputB) {
                alert("Mohon isi kedua himpunan!");
                return;
            }

            // Ubah string menjadi array, bersihkan spasi
            const arrA = inputA.split(',').map(item => item.trim());
            const arrB = inputB.split(',').map(item => item.trim());

            // Cari irisan (Intersection)
            const intersection = arrA.filter(value => arrB.includes(value));

            if (intersection.length > 0) {
                outputText.innerText = "{ " + intersection.join(", ") + " }";
            } else {
                outputText.innerText = "{ } (Himpunan Kosong)";
            }

            outputBox.style.display = "block";
        }
    </script>
</body>
</html>
